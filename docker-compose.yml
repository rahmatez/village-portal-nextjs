services:
  postgres:
    image: postgres:14-alpine
    container_name: desa-mindaka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: desa_mindaka
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: desa-mindaka-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/desa_mindaka?schema=public
      JWT_SECRET: desa-mindaka-jwt-secret-change-in-production-32chars
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  # Uncomment untuk menjalankan frontend di Docker
  # web:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: desa-mindaka-web
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:4000/api
  #   depends_on:
  #     - api

volumes:
  postgres_data:
